name: Build Liquid Music APK

on:
  workflow_dispatch:
  push:
    branches: [liquid-music-android]

permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: liquid-music-player
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 17

      - uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: 8.7

      - name: Build debug APK
        run: gradle assembleDebug --no-daemon

      - uses: actions/upload-artifact@v4
        with:
          name: LiquidMusic-APK
          path: liquid-music-player/app/build/outputs/apk/debug/app-debug.apk

      - name: Save the APK in the repository
        run: |
          cd "$GITHUB_WORKSPACE"
          cp liquid-music-player/app/build/outputs/apk/debug/app-debug.apk LiquidMusic-debug.apk
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add LiquidMusic-debug.apk
          git commit -m "Add built Liquid Music APK"
          git push
